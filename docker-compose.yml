services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobagent
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: jobpass
    ports:
      - "5433:5432"        # ← 5433 à l'extérieur, 5432 dans le container
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: