<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: 'Segoe UI', sans-serif;
      background: #fdf8f0;
      color: #1e1a14;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .logo {
      font-weight: 800;
      font-size: 18px;
    }
    .logo span { color: #2db87a; }
    .card {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(160, 140, 110, 0.2);
      margin-bottom: 16px;
    }
    .title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .company { font-size: 12px; color: #6b5c42; }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #2db87a;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 11px; text-align: center; }
    .settings-btn { position: absolute; top: 16px; right: 16px; cursor: pointer; font-size: 14px; opacity: 0.6; }
    .settings-btn:hover { opacity: 1; }
    .input { width: 100%; padding: 8px; border-radius: 6px; border: 1.5px solid rgba(160, 140, 110, 0.2); margin-bottom: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="settings-btn" id="open-settings">⚙️</div>
  <div class="header">
    <div class="logo">Job<span>Agent</span></div>
  </div>

  <div id="main-view">
    <div id="job-card" class="card" style="display:none;">
      <div id="job-title" class="title">...</div>
      <div id="job-company" class="company">...</div>
    </div>
    <div id="loading">Recherche d'offres en cours...</div>
    <button id="save-btn" class="btn" style="display:none;">Sauvegarder l'offre</button>
    <div id="status" class="status"></div>
  </div>

  <div id="settings-view" style="display:none;">
    <div class="title" style="margin-bottom: 15px;">Réglages</div>
    <label style="font-size: 10px; text-transform: uppercase; color: #6b5c42; display: block; margin-bottom: 4px;">Token API (depuis Profil)</label>
    <input type="password" id="token-input" class="input" placeholder="Votre token bearer...">
    <button id="save-settings" class="btn">Enregistrer</button>
    <button id="back-btn" class="btn" style="background:#8b7355; margin-top: 5px;">Retour</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
