services:
  - type: web
    name: agent-job-1
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt && playwright install chromium && playwright install-deps chromium"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
