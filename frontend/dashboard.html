<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Agent — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4ede0;
    --surface: #fdf8ee;
    --surface2: #e6dccf;
    --border: #c9bfad30;
    --border-bright: #a89c8850;
    --accent: #3ec99a;
    --accent2: #25a87e;
    --accent3: #e08a4a;
    --danger: #d05a4a;
    --success: #3aaa7a;
    --text: #26211a;
    --text-muted: #5c5044;
    --text-dim: #a09888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* GRID BACKGROUND */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(62,201,154,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62,201,154,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  #root { position: relative; z-index: 1; }

  /* LAYOUT */
  .layout { display: flex; min-height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    height: 100vh;
    top: 0; left: 0;
    padding: 24px 0;
    z-index: 100;
  }

  .sidebar-logo {
    padding: 0 20px 28px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-logo .brand {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .sidebar-logo .brand span { color: var(--accent); }

  .sidebar-logo .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
    margin-left: 6px;
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .sidebar-nav { padding: 16px 12px; flex: 1; }

  .nav-section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 0 8px;
    margin: 16px 0 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 400;
    color: var(--text-muted);
    transition: all 0.15s;
    margin-bottom: 2px;
    border: 1px solid transparent;
  }

  .nav-item:hover { background: var(--surface2); color: var(--text); }

  .nav-item.active {
    background: rgba(45,184,138,0.12);
    color: var(--accent);
    border-color: rgba(45,184,138,0.25);
    font-weight: 500;
  }

  .nav-icon { font-size: 15px; width: 18px; text-align: center; }

  .nav-badge {
    margin-left: auto;
    background: var(--accent);
    color: white;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 500;
  }

  /* MAIN */
  .main { margin-left: 220px; flex: 1; padding: 28px 32px; }

  /* PAGE HEADER */
  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .page-title {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .page-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 300;
  }

  /* BUTTONS */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border-bright);
  }
  .btn-secondary:hover { background: #ddd8ce; }

  .btn-danger {
    background: rgba(208,90,74,0.1);
    color: var(--danger);
    border: 1px solid rgba(208,90,74,0.2);
  }

  .btn-success {
    background: rgba(58,170,122,0.12);
    color: var(--success);
    border: 1px solid rgba(58,170,122,0.2);
  }

  .btn-sm { padding: 5px 12px; font-size: 12px; }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  /* STAT CARDS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .stat-card:hover { box-shadow: 0 4px 20px rgba(76,186,144,0.1); }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .stat-card.purple::before { background: linear-gradient(90deg, var(--accent), transparent); }
  .stat-card.teal::before { background: linear-gradient(90deg, var(--accent2), transparent); }
  .stat-card.orange::before { background: linear-gradient(90deg, var(--accent3), transparent); }
  .stat-card.green::before { background: linear-gradient(90deg, var(--success), transparent); }

  .stat-label {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .stat-icon {
    position: absolute;
    top: 18px; right: 18px;
    font-size: 22px;
    opacity: 0.15;
  }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 20px;
  }

  .card-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .card-body { padding: 0; }

  /* TABLE */
  .table { width: 100%; border-collapse: collapse; }

  .table th {
    padding: 11px 16px;
    text-align: left;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border-bright);
    background: rgba(0,0,0,0.02);
  }

  .table td {
    padding: 13px 16px;
    font-size: 13px;
    border-bottom: 1px solid var(--border-bright);
    color: var(--text-muted);
    vertical-align: middle;
  }

  .table tr:last-child td { border-bottom: none; }
  .table tr:hover td { background: rgba(76,186,144,0.04); }

  .table .title-cell {
    color: var(--text);
    font-weight: 500;
    font-size: 13.5px;
  }

  /* BADGES */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }

  .badge-dot { width: 5px; height: 5px; border-radius: 50%; }

  .badge-sent { background: rgba(62,201,154,0.15); color: var(--accent2); }
  .badge-sent .badge-dot { background: var(--accent2); }
  .badge-draft { background: rgba(224,138,74,0.13); color: var(--accent3); }
  .badge-draft .badge-dot { background: var(--accent3); }
  .badge-interview { background: rgba(58,170,122,0.15); color: #1f7a55; }
  .badge-interview .badge-dot { background: #1f7a55; }
  .badge-refused { background: rgba(208,90,74,0.1); color: var(--danger); }
  .badge-refused .badge-dot { background: var(--danger); }
  .badge-followup { background: rgba(26,158,116,0.1); color: var(--accent2); }
  .badge-followup .badge-dot { background: var(--accent2); }
  .badge-review { background: rgba(0,0,0,0.05); color: var(--text-muted); }
  .badge-review .badge-dot { background: var(--text-dim); }

  /* SCORE BAR */
  .score-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-track {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
    max-width: 80px;
  }

  .score-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }

  .score-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    min-width: 28px;
  }

  /* ACTIONS ROW */
  .actions-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  /* GRID 2 COLS */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

  /* ACTIVITY FEED */
  .activity-item {
    display: flex;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }

  .activity-item:last-child { border-bottom: none; }

  .activity-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }

  .activity-content { flex: 1; }

  .activity-title {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 2px;
  }

  .activity-meta {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
  }

  /* LOADING */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text-dim);
    font-size: 13px;
    gap: 10px;
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border-bright);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-dim);
  }

  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
  .empty-text { font-size: 13px; }

  /* TOAST */
  .toast-container {
    position: fixed;
    bottom: 24px; right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
  }

  .toast {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 280px;
    animation: slide-in 0.2s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }

  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--accent); }

  @keyframes slide-in {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(4px);
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 16px;
    padding: 28px;
    width: 600px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .email-preview {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-muted);
    white-space: pre-wrap;
    font-family: 'DM Mono', monospace;
    max-height: 300px;
    overflow-y: auto;
    margin: 12px 0;
  }

  .modal-footer {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  /* FILTER BAR */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }

  .filter-btn:hover { border-color: var(--border-bright); color: var(--text); }

  .filter-btn.active {
    background: rgba(45,184,138,0.12);
    border-color: rgba(45,184,138,0.3);
    color: var(--accent2);
  }

  /* HEADER ACTIONS */
  .header-actions { display: flex; gap: 10px; align-items: center; }

  /* PROGRESS RING */
  .progress-ring { display: inline-block; }

  /* OFFER CARD */
  .offer-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }

  .offer-card:hover { border-color: var(--border-bright); }

  .offer-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .offer-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }

  .offer-company {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }

  /* TABS */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .tab {
    padding: 10px 20px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    margin-bottom: -1px;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* API URL CHIP */
  .api-chip {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API = 'http://localhost:8000';

// ============================================================
// API HOOKS
// ============================================================

function useApi(endpoint, deps = []) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const fetch_ = useCallback(async () => {
    setLoading(true);
    try {
      const r = await fetch(API + endpoint);
      const d = await r.json();
      setData(d);
      setError(null);
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [endpoint, ...deps]);

  useEffect(() => { fetch_(); }, [fetch_]);
  return { data, loading, error, refetch: fetch_ };
}

// ============================================================
// TOAST SYSTEM
// ============================================================

function ToastContainer({ toasts }) {
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>
          <span>{t.type === 'success' ? '✓' : t.type === 'error' ? '✕' : 'ℹ'}</span>
          {t.message}
        </div>
      ))}
    </div>
  );
}

function useToast() {
  const [toasts, setToasts] = useState([]);
  const add = (message, type = 'info') => {
    const id = Date.now();
    setToasts(p => [...p, { id, message, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
  };
  return { toasts, success: m => add(m, 'success'), error: m => add(m, 'error'), info: m => add(m, 'info') };
}

// ============================================================
// STATUS BADGE
// ============================================================

const STATUS_MAP = {
  sent: { label: 'Envoyée', cls: 'sent' },
  draft: { label: 'Brouillon', cls: 'draft' },
  pending_review: { label: 'À valider', cls: 'draft' },
  ready_to_send: { label: 'Prête', cls: 'draft' },
  follow_up_sent: { label: 'Relancée', cls: 'followup' },
  follow_up_scheduled: { label: 'Relance prévue', cls: 'followup' },
  response_received: { label: 'Réponse reçue', cls: 'interview' },
  interview_proposed: { label: 'Entretien 🎯', cls: 'interview' },
  interview_confirmed: { label: 'Confirmé ✓', cls: 'interview' },
  refused: { label: 'Refus', cls: 'refused' },
  archived: { label: 'Archivée', cls: 'review' },
};

function StatusBadge({ status }) {
  const s = STATUS_MAP[status] || { label: status, cls: 'review' };
  return (
    <span className={`badge badge-${s.cls}`}>
      <span className="badge-dot"></span>
      {s.label}
    </span>
  );
}

// ============================================================
// SCORE BAR
// ============================================================

function ScoreBar({ score }) {
  if (!score) return <span style={{color: 'var(--text-dim)', fontSize: 12}}>—</span>;
  const color = score >= 80 ? '#68d391' : score >= 60 ? '#f6ad55' : '#fc8181';
  return (
    <div className="score-bar">
      <div className="score-track">
        <div className="score-fill" style={{ width: `${score}%`, background: color }}></div>
      </div>
      <span className="score-label">{score}</span>
    </div>
  );
}

// ============================================================
// APPLICATION MODAL
// ============================================================

function AppModal({ app, onClose, toast }) {
  const [sending, setSending] = useState(false);

  const sendDraft = async (recipientEmail) => {
    const email = prompt('Email du recruteur :', 'recruteur@entreprise.com');
    if (!email) return;
    setSending(true);
    try {
      const r = await fetch(`${API}/api/applications/${app.id}/send?mode=draft&recipient_email=${encodeURIComponent(email)}`, { method: 'POST' });
      const d = await r.json();
      if (d.draft_id) { toast.success('Brouillon créé dans Gmail !'); onClose(); }
      else toast.error(d.detail || 'Erreur');
    } catch(e) { toast.error('Erreur réseau'); }
    finally { setSending(false); }
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-title">📧 {app.offer}</div>
        <div style={{fontSize:13, color:'var(--text-muted)', marginBottom:16}}>{app.company}</div>
        <div style={{marginBottom:8, fontSize:12, color:'var(--text-dim)', fontFamily:'DM Mono, monospace', textTransform:'uppercase', letterSpacing:'1px'}}>Sujet</div>
        <div style={{fontSize:13, color:'var(--text)', marginBottom:16, padding:'10px 14px', background:'var(--bg)', borderRadius:8, border:'1px solid var(--border)'}}>{app.email_subject}</div>
        <div style={{marginBottom:8, fontSize:12, color:'var(--text-dim)', fontFamily:'DM Mono, monospace', textTransform:'uppercase', letterSpacing:'1px'}}>Email</div>
        <div className="email-preview">{app.email_body || 'Chargement...'}</div>
        {app.cover_letter && <>
          <div style={{marginBottom:8, fontSize:12, color:'var(--text-dim)', fontFamily:'DM Mono, monospace', textTransform:'uppercase', letterSpacing:'1px', marginTop:16}}>Lettre de motivation</div>
          <div className="email-preview">{app.cover_letter}</div>
        </>}
        <div style={{display:'flex', gap:8, flexWrap:'wrap', marginTop:16, paddingTop:12, borderTop:'1px solid var(--border)'}}>

        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Fermer</button>
          {['pending_review', 'ready_to_send', 'draft'].includes(app.status) &&

  );
}

function DashboardPage({ toast }) {
  const { data: apps, loading: appsLoading } = useApi('/api/applications/');
  const { data: jobs } = useApi('/api/jobs/');
  const { data: gmailStatus } = useApi('/api/auth/gmail/status');
  const [scraping, setScraping] = useState(false);
  const [scoring, setScoring] = useState(false);
  const [classifying, setClassifying] = useState(false);

  const stats = apps ? {
    total: apps.length,
    sent: apps.filter(a => a.status === 'sent').length,
    interviews: apps.filter(a => ['interview_proposed','interview_confirmed'].includes(a.status)).length,
    pending: apps.filter(a => ['pending_review','ready_to_send'].includes(a.status)).length,
  } : {};

  const jobStats = jobs ? {
    total: jobs.length,
    shortlisted: jobs.filter(j => j.status === 'shortlisted').length,
    ignored: jobs.filter(j => j.status === 'ignored').length,
  } : {};

  const triggerScrape = async () => {
    setScraping(true);
    try {
      const r = await fetch(`${API}/api/jobs/scrape`, { method: 'POST' });
      const d = await r.json();
      toast.success('Scraping lancé en arrière-plan');
    } catch(e) { toast.error('Erreur scraping'); }
    finally { setTimeout(() => setScraping(false), 3000); }
  };

  const triggerScoreAll = async () => {
    setScoring(true);
    try {
      const r = await fetch(`${API}/api/jobs/score-all`, { method: 'POST' });
      const d = await r.json();
      toast.success(`${d.scored || 0} offres scorées`);
    } catch(e) { toast.error('Erreur scoring'); }
    finally { setScoring(false); }
  };

  const triggerClassify = async () => {
    setClassifying(true);
    try {
      const r = await fetch(`${API}/api/applications/classify-responses`, { method: 'POST' });
      const d = await r.json();
      if (d.classified > 0) toast.success(`${d.classified} réponse(s) classifiée(s)`);
      else toast.info('Aucun email non traité');
    } catch(e) { toast.error('Erreur classification'); }
    finally { setClassifying(false); }
  };

  const recentApps = apps ? apps.slice(0, 5) : [];
  const topOffers = jobs ? jobs.filter(j => j.relevance_score).sort((a,b) => b.relevance_score - a.relevance_score).slice(0, 4) : [];

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Vue d'ensemble</div>
          <div className="page-subtitle">
            {gmailStatus?.connected
              ? `✓ Gmail connecté — ${gmailStatus.email}`
              : '⚠ Gmail non connecté'}
          </div>
        </div>
        <div className="header-actions">
          <button className="btn btn-secondary btn-sm" onClick={triggerClassify} disabled={classifying}>
            {classifying ? <span className="spinner"></span> : '📬'} Classifier réponses
          </button>
          <button className="btn btn-secondary btn-sm" onClick={triggerScoreAll} disabled={scoring}>
            {scoring ? <span className="spinner"></span> : '⚡'} Scorer offres
          </button>
          <button className="btn btn-primary btn-sm" onClick={triggerScrape} disabled={scraping}>
            {scraping ? <span className="spinner"></span> : '🔍'} Lancer scraping
          </button>
        </div>
      </div>

      {/* STATS */}
      <div className="stats-grid">
        <div className="stat-card purple">
          <span className="stat-icon">📨</span>
          <div className="stat-label">Candidatures</div>
          <div className="stat-value">{appsLoading ? '—' : stats.total}</div>
          <div className="stat-sub">{stats.sent} envoyées</div>
        </div>
        <div className="stat-card teal">
          <span className="stat-icon">🎯</span>
          <div className="stat-label">Entretiens</div>
          <div className="stat-value">{appsLoading ? '—' : stats.interviews}</div>
          <div className="stat-sub">proposés / confirmés</div>
        </div>
        <div className="stat-card orange">
          <span className="stat-icon">⏳</span>
          <div className="stat-label">À valider</div>
          <div className="stat-value">{appsLoading ? '—' : stats.pending}</div>
          <div className="stat-sub">brouillons en attente</div>
        </div>
        <div className="stat-card green">
          <span className="stat-icon">📋</span>
          <div className="stat-label">Offres scrapées</div>
          <div className="stat-value">{jobStats.total || '—'}</div>
          <div className="stat-sub">{jobStats.shortlisted || 0} shortlistées</div>
        </div>
      </div>

      <div className="grid-2">
        {/* RECENT APPLICATIONS */}
        <div className="card">
          <div className="card-header">
            <span className="card-title">Candidatures récentes</span>
            <span className="api-chip">GET /api/applications/</span>
          </div>
          <div className="card-body">
            {appsLoading ? <div className="loading"><span className="spinner"></span> Chargement...</div> :
             recentApps.length === 0 ? <div className="empty"><div className="empty-icon">📭</div><div className="empty-text">Aucune candidature</div></div> :
             recentApps.map(a => (
              <div className="activity-item" key={a.id}>
                <div className="activity-dot" style={{background: a.status === 'interview_proposed' ? '#68d391' : a.status === 'refused' ? '#fc8181' : a.status === 'sent' ? '#7c6af7' : '#f6ad55'}}></div>
                <div className="activity-content">
                  <div className="activity-title">{a.offer}</div>
                  <div className="activity-meta">{a.company} · <StatusBadge status={a.status} /></div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* TOP OFFERS */}
        <div className="card">
          <div className="card-header">
            <span className="card-title">Meilleures offres</span>
            <span className="api-chip">GET /api/jobs/</span>
          </div>
          <div className="card-body">
            {topOffers.length === 0 ? <div className="empty"><div className="empty-icon">🔍</div><div className="empty-text">Lance un scraping</div></div> :
             topOffers.map(j => (
              <div className="activity-item" key={j.id}>
                <div className="activity-dot" style={{background: j.relevance_score >= 80 ? '#68d391' : j.relevance_score >= 60 ? '#f6ad55' : '#fc8181'}}></div>
                <div className="activity-content">
                  <div className="activity-title">{j.title}</div>
                  <div className="activity-meta" style={{display:'flex', alignItems:'center', gap:8}}>
                    <span>{j.platform}</span>
                    <ScoreBar score={j.relevance_score} />
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function ApplicationsPage({ toast }) {
  const [filter, setFilter] = useState('all');
  const [selectedApp, setSelectedApp] = useState(null);
  const { data: apps, loading, refetch } = useApi('/api/applications/');
  const [generating, setGenerating] = useState(false);

  const filtered = apps ? apps.filter(a => {
    if (filter === 'all') return true;
    if (filter === 'pending') return ['pending_review','ready_to_send'].includes(a.status);
    if (filter === 'sent') return a.status === 'sent';
    if (filter === 'interview') return ['interview_proposed','interview_confirmed'].includes(a.status);
    if (filter === 'followup') return ['follow_up_sent','follow_up_scheduled'].includes(a.status);
    if (filter === 'refused') return a.status === 'refused';
    return true;
  }) : [];

  const loadApp = async (id) => {
    const r = await fetch(`${API}/api/applications/${id}`);
    const d = await r.json();
    setSelectedApp(d);
  };

  const generateBatch = async () => {
    setGenerating(true);
    try {
      const r = await fetch(`${API}/api/applications/generate-batch?limit=5`, { method: 'POST' });
      const d = await r.json();
      toast.success(`${d.generated} candidature(s) générée(s)`);
      refetch();
    } catch(e) { toast.error('Erreur génération'); }
    finally { setGenerating(false); }
  };

  const triggerFollowups = async () => {
    try {
      const r = await fetch(`${API}/api/applications/trigger-followups`, { method: 'POST' });
      const d = await r.json();
      toast.info('Vérification des relances lancée');
    } catch(e) { toast.error('Erreur relances'); }
  };

  const FILTERS = [
    { key: 'all', label: 'Toutes' },
    { key: 'pending', label: '⏳ À valider' },
    { key: 'sent', label: '📨 Envoyées' },
    { key: 'interview', label: '🎯 Entretiens' },
    { key: 'followup', label: '🔁 Relancées' },
    { key: 'refused', label: '✕ Refus' },
  ];

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Candidatures</div>
          <div className="page-subtitle">{apps ? `${apps.length} candidatures au total` : ''}</div>
        </div>
        <div className="header-actions">
          <button className="btn btn-secondary btn-sm" onClick={triggerFollowups}>🔁 Vérifier relances</button>
          <button className="btn btn-primary btn-sm" onClick={generateBatch} disabled={generating}>
            {generating ? <span className="spinner"></span> : '✨'} Générer candidatures
          </button>
        </div>
      </div>

      <div className="filter-bar" style={{marginBottom:16}}>
        {FILTERS.map(f => (
          <button key={f.key} className={`filter-btn ${filter === f.key ? 'active' : ''}`} onClick={() => setFilter(f.key)}>
            {f.label}
          </button>
        ))}
      </div>

      <div className="card">
        <div className="card-body">
          {loading ? <div className="loading"><span className="spinner"></span> Chargement...</div> :
           filtered.length === 0 ? <div className="empty"><div className="empty-icon">📭</div><div className="empty-text">Aucune candidature</div></div> : (
            <table className="table">
              <thead>
                <tr>
                  <th>Poste</th>
                  <th>Entreprise</th>
                  <th>Statut</th>
                  <th>Confiance</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(a => (
                  <tr key={a.id}>
                    <td className="title-cell" style={{maxWidth:220, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{a.offer}</td>
                    <td>{a.company}</td>
                    <td><StatusBadge status={a.status} /></td>
                    <td>
                      {a.confidence ?
                        <span style={{fontFamily:'DM Mono,monospace', fontSize:12, color: a.confidence >= 0.85 ? 'var(--success)' : 'var(--accent3)'}}>
                          {Math.round(a.confidence * 100)}%
                        </span> : '—'}
                    </td>
                    <td style={{fontFamily:'DM Mono,monospace', fontSize:11, color:'var(--text-dim)'}}>
                      {new Date(a.created_at).toLocaleDateString('fr-FR')}

                    <td>
                      <div className="actions-row">
                        <button className="btn btn-secondary btn-sm" onClick={() => loadApp(a.id)}>👁 Voir</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>

      {selectedApp && <AppModal app={selectedApp} onClose={() => setSelectedApp(null)} toast={toast} />}
    </div>
  );
}

function OffersPage({ toast }) {
  const [filter, setFilter] = useState('all');
  const { data: jobs, loading, refetch } = useApi('/api/jobs/');
  const [scoring, setScoring] = useState(false);
  const [scraping, setScraping] = useState(false);
  const [generating, setGenerating] = useState({});

  const filtered = jobs ? jobs.filter(j => {
    if (filter === 'all') return true;
    return j.status === filter;
  }) : [];

  const scoreAll = async () => {
    setScoring(true);
    try {
      const r = await fetch(`${API}/api/jobs/score-all`, { method: 'POST' });
      const d = await r.json();
      toast.success(`${d.scored} offres scorées`);
      refetch();
    } catch(e) { toast.error('Erreur'); }
    finally { setScoring(false); }
  };

  const scrape = async () => {
    setScraping(true);
    try {
      await fetch(`${API}/api/jobs/scrape`, { method: 'POST' });
      toast.success('Scraping lancé !');
    } catch(e) { toast.error('Erreur scraping'); }
    finally { setTimeout(() => setScraping(false), 3000); }
  };

  const generateForOffer = async (offerId) => {
    setGenerating(p => ({...p, [offerId]: true}));
    try {
      const r = await fetch(`${API}/api/applications/generate/${offerId}`, { method: 'POST' });
      const d = await r.json();
      toast.success(`Candidature générée (${Math.round((d.confidence||0)*100)}% confiance)`);
    } catch(e) { toast.error('Erreur génération'); }
    finally { setGenerating(p => ({...p, [offerId]: false})); }
  };

  const FILTERS = [
    { key: 'all', label: 'Toutes' },
    { key: 'to_review', label: '🔍 À analyser' },
    { key: 'shortlisted', label: '⭐ Shortlistées' },
    { key: 'to_apply', label: '📤 À candidater' },
    { key: 'ignored', label: '✕ Ignorées' },
  ];

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Offres d'emploi</div>
          <div className="page-subtitle">{jobs ? `${jobs.length} offres en base` : ''}</div>
        </div>
        <div className="header-actions">
          <button className="btn btn-secondary btn-sm" onClick={scoreAll} disabled={scoring}>
            {scoring ? <span className="spinner"></span> : '⚡'} Scorer (10 suivantes)
          </button>
          <button className="btn btn-primary btn-sm" onClick={scrape} disabled={scraping}>
            {scraping ? <span className="spinner"></span> : '🔍'} Scraper WTTJ
          </button>
        </div>
      </div>

      <div className="filter-bar" style={{marginBottom:16}}>
        {FILTERS.map(f => (
          <button key={f.key} className={`filter-btn ${filter === f.key ? 'active' : ''}`} onClick={() => setFilter(f.key)}>
            {f.label} {jobs ? `(${jobs.filter(j => f.key === 'all' ? true : j.status === f.key).length})` : ''}
          </button>
        ))}
      </div>

      <div className="card">
        <div className="card-body">
          {loading ? <div className="loading"><span className="spinner"></span> Chargement...</div> :
           filtered.length === 0 ? <div className="empty"><div className="empty-icon">🔍</div><div className="empty-text">Lance un scraping pour importer des offres</div></div> : (
            <table className="table">
              <thead>
                <tr>
                  <th>Titre</th>
                  <th>Plateforme</th>
                  <th>Localisation</th>
                  <th>Score</th>
                  <th>Statut</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(j => (
                  <tr key={j.id}>
                    <td className="title-cell" style={{maxWidth:240, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{j.title}</td>
                    <td>
                      <span className="badge badge-review" style={{textTransform:'uppercase'}}>{j.platform}</span>
                    </td>
                    <td style={{fontSize:12, color:'var(--text-muted)'}}>{j.location || '—'}</td>
                    <td><ScoreBar score={j.relevance_score} /></td>
                    <td>
                      <span className={`badge badge-${j.status === 'shortlisted' ? 'interview' : j.status === 'ignored' ? 'refused' : 'review'}`}>
                        <span className="badge-dot"></span>
                        {j.status}
                      </span>
                    </td>
                    <td>
                      <div className="actions-row">
                        {j.status === 'shortlisted' &&
                          <button className="btn btn-primary btn-sm" onClick={() => generateForOffer(j.id)} disabled={generating[j.id]}>
                            {generating[j.id] ? <span className="spinner"></span> : '✨'} Candidater
                          </button>
                        }
                        <a href={j.url} target="_blank" rel="noopener" className="btn btn-secondary btn-sm">🔗</a>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

          <div className="nav-section-label">Navigation</div>
          {NAV.map(n => (
            <div key={n.key} className={`nav-item ${page === n.key ? 'active' : ''}`} onClick={() => setPage(n.key)}>
              <span className="nav-icon">{n.icon}</span>
              {n.label}
              {n.badge ? <span className="nav-badge">{n.badge}</span> : null}
            </div>
          ))}
          <div className="nav-section-label">Système</div>
          {TOOLS.map(n => (
            <div key={n.key} className={`nav-item ${page === n.key ? 'active' : ''}`} onClick={() => setPage(n.key)}>
              <span className="nav-icon">{n.icon}</span>
              {n.label}
            </div>
          ))}
          {interviewCount > 0 && (
            <div style={{margin:'16px 0 0', padding:'12px', background:'rgba(104,211,145,0.08)', border:'1px solid rgba(104,211,145,0.2)', borderRadius:10}}>
              <div style={{fontSize:11, color:'var(--success)', fontWeight:600, marginBottom:4}}>🎯 {interviewCount} entretien(s) proposé(s)</div>
              <div style={{fontSize:11, color:'var(--text-dim)'}}>Vérifier les brouillons Gmail</div>
            </div>
          )}
        </nav>
        <div style={{padding:'0 16px 16px', borderTop:'1px solid var(--border)', marginTop:'auto', paddingTop:16}}>
          <div style={{fontSize:11, color:'var(--text-dim)', fontFamily:'DM Mono,monospace'}}>API: localhost:8000</div>
        </div>
      </aside>

      <main className="main">
        {pages[page]}
      </main>

      <ToastContainer toasts={toast.toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
