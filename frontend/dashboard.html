<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobAgent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4ede0;
  --surface: #fdf8f0;
  --surface2: #ede5d6;
  --surface3: #e4dace;
  --border: rgba(160,140,110,0.2);
  --border-strong: rgba(160,140,110,0.4);
  --mint: #2db87a;
  --mint-light: #e8f7f0;
  --mint-mid: #a8e0c4;
  --mint-dark: #1e9a63;
  --cream-dark: #8b7355;
  --text: #1e1a14;
  --text-muted: #6b5c42;
  --text-dim: #a89478;
  --danger: #c0392b;
  --danger-light: #fdecea;
  --warn: #d4842a;
  --warn-light: #fdf3e7;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }

/* AUTH */
.auth-wrap { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
.auth-left { background:var(--text); display:flex; flex-direction:column; justify-content:space-between; padding:48px; position:relative; overflow:hidden; }
.auth-left::before { content:''; position:absolute; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle,rgba(45,184,122,0.15) 0%,transparent 70%); top:-100px; right:-100px; }
.auth-brand { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; color:var(--bg); letter-spacing:-1px; position:relative; z-index:1; }
.auth-brand span { color:var(--mint); }
.auth-left-body { position:relative; z-index:1; }
.auth-tagline { font-family:'Syne',sans-serif; font-size:40px; font-weight:700; color:var(--bg); line-height:1.15; margin-bottom:18px; letter-spacing:-1.5px; }
.auth-tagline span { color:var(--mint); }
.auth-desc { font-size:14px; color:rgba(244,237,224,0.55); line-height:1.65; font-weight:300; max-width:320px; }
.auth-features { position:relative; z-index:1; display:flex; flex-direction:column; gap:9px; }
.auth-feature { display:flex; align-items:center; gap:10px; font-size:13px; color:rgba(244,237,224,0.45); }
.auth-dot { width:5px; height:5px; border-radius:50%; background:var(--mint); flex-shrink:0; }
.auth-right { display:flex; align-items:center; justify-content:center; padding:48px; background:var(--surface); }
.auth-box { width:100%; max-width:370px; }
.auth-title { font-family:'Syne',sans-serif; font-size:26px; font-weight:700; margin-bottom:5px; letter-spacing:-0.5px; }
.auth-sub { font-size:13.5px; color:var(--text-muted); margin-bottom:28px; font-weight:300; }
.auth-err { padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; background:var(--danger-light); color:var(--danger); border:1px solid rgba(192,57,43,0.2); display:flex; align-items:center; gap:7px; }
.form-grp { margin-bottom:16px; }
.form-lbl { display:block; font-size:11px; font-weight:500; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.8px; font-family:'DM Mono',monospace; }
.form-inp { width:100%; padding:11px 14px; background:var(--bg); border:1.5px solid var(--border-strong); border-radius:9px; font-size:14px; color:var(--text); font-family:'DM Sans',sans-serif; transition:all 0.15s; outline:none; }
.form-inp:focus { border-color:var(--mint); background:white; box-shadow:0 0 0 3px rgba(45,184,122,0.1); }
.form-inp::placeholder { color:var(--text-dim); }
.pw-hint { font-size:11px; color:var(--text-dim); margin-top:4px; }
.btn-submit { width:100%; padding:13px; background:var(--text); color:var(--bg); border:none; border-radius:9px; font-size:14px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; transition:all 0.15s; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-submit:hover { background:#2c2416cc; transform:translateY(-1px); }
.btn-submit:disabled { opacity:0.55; cursor:not-allowed; transform:none; }
.auth-toggle { text-align:center; margin-top:18px; font-size:13px; color:var(--text-muted); }
.auth-toggle a { color:var(--mint-dark); cursor:pointer; font-weight:500; }
.auth-toggle a:hover { text-decoration:underline; }

/* LAYOUT */
.layout { display:flex; min-height:100vh; }
.sidebar { width:228px; background:var(--text); display:flex; flex-direction:column; position:fixed; height:100vh; z-index:100; }
.sb-brand { padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,0.07); }
.sb-logo { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; color:var(--bg); letter-spacing:-0.5px; }
.sb-logo span { color:var(--mint); }
.sb-version { font-size:10px; color:rgba(255,255,255,0.18); font-family:'DM Mono',monospace; margin-top:2px; }
.sb-user { padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.07); display:flex; align-items:center; gap:10px; }
.sb-avatar { width:34px; height:34px; border-radius:50%; background:var(--mint); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:white; font-family:'Syne',sans-serif; flex-shrink:0; }
.sb-uname { font-size:13px; color:var(--bg); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sb-uemail { font-size:10.5px; color:rgba(255,255,255,0.25); font-family:'DM Mono',monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sb-nav { padding:14px 10px; flex:1; overflow-y:auto; }
.sb-section { font-size:10px; color:rgba(255,255,255,0.18); font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:1.5px; padding:0 10px; margin:12px 0 5px; }
.nav-item { display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13.5px; color:rgba(255,255,255,0.4); transition:all 0.15s; margin-bottom:1px; border:1px solid transparent; }
.nav-item:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.75); }
.nav-item.active { background:rgba(45,184,122,0.15); color:var(--mint); border-color:rgba(45,184,122,0.2); font-weight:500; }
.nav-icon { font-size:15px; width:18px; text-align:center; flex-shrink:0; }
.nav-badge { margin-left:auto; background:var(--mint); color:white; font-size:10px; font-family:'DM Mono',monospace; padding:1px 6px; border-radius:10px; }
.sb-bottom { padding:12px 10px; border-top:1px solid rgba(255,255,255,0.07); }
.sb-interview-alert { background:rgba(45,184,122,0.1); border:1px solid rgba(45,184,122,0.2); border-radius:9px; padding:11px 12px; margin-bottom:9px; }
.btn-logout { width:100%; padding:9px; background:transparent; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:rgba(255,255,255,0.3); font-size:12px; cursor:pointer; transition:all 0.15s; font-family:'DM Sans',sans-serif; display:flex; align-items:center; justify-content:center; gap:6px; }
.btn-logout:hover { border-color:rgba(192,57,43,0.3); color:#e07070; background:rgba(192,57,43,0.05); }
.main { margin-left:228px; padding:28px 32px; min-height:100vh; }

/* PAGE */
.page-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px; }
.page-title { font-family:'Syne',sans-serif; font-size:24px; font-weight:700; letter-spacing:-0.5px; }
.page-sub { font-size:13px; color:var(--text-muted); margin-top:3px; font-weight:300; }
.hdr-actions { display:flex; gap:8px; align-items:center; }

/* BUTTONS */
.btn { display:inline-flex; align-items:center; gap:7px; padding:9px 18px; border-radius:9px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all 0.15s; font-family:'DM Sans',sans-serif; }
.btn-primary { background:var(--text); color:var(--bg); }
.btn-primary:hover { background:#2c2416cc; transform:translateY(-1px); }
.btn-mint { background:var(--mint); color:white; }
.btn-mint:hover { background:var(--mint-dark); transform:translateY(-1px); }
.btn-sec { background:var(--surface2); color:var(--text); border:1px solid var(--border-strong); }
.btn-sec:hover { background:var(--surface3); }
.btn-ghost { background:transparent; color:var(--text-muted); border:1px solid var(--border-strong); }
.btn-ghost:hover { background:var(--surface2); color:var(--text); }
.btn-sm { padding:6px 13px; font-size:12px; }
.btn:disabled { opacity:0.5; cursor:not-allowed; transform:none !important; }

/* STATS */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:22px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; position:relative; overflow:hidden; }
.stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:12px 12px 0 0; }
.stat-card.c-mint::before { background:var(--mint); }
.stat-card.c-cream::before { background:var(--cream-dark); }
.stat-card.c-warn::before { background:var(--warn); }
.stat-card.c-dim::before { background:var(--text-dim); }
.stat-lbl { font-size:11px; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin-bottom:8px; }
.stat-val { font-family:'Syne',sans-serif; font-size:32px; font-weight:700; line-height:1; margin-bottom:5px; }
.stat-sub { font-size:12px; color:var(--text-muted); }
.stat-ico { position:absolute; top:18px; right:16px; font-size:22px; opacity:0.1; }

/* CARD */
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:20px; }
.card-hdr { padding:15px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.card-ttl { font-family:'Syne',sans-serif; font-size:14px; font-weight:600; }

/* TABLE */
.tbl { width:100%; border-collapse:collapse; }
.tbl th { padding:10px 16px; text-align:left; font-size:10.5px; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); border-bottom:1px solid var(--border); background:rgba(0,0,0,0.02); }
.tbl td { padding:12px 16px; font-size:13px; border-bottom:1px solid var(--border); color:var(--text-muted); vertical-align:middle; }
.tbl tr:last-child td { border-bottom:none; }
.tbl tr:hover td { background:rgba(45,184,122,0.025); }
.tbl .tc { color:var(--text); font-weight:500; }

/* BADGES */
.badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500; font-family:'DM Mono',monospace; white-space:nowrap; }
.bdot { width:5px; height:5px; border-radius:50%; }
.b-mint { background:var(--mint-light); color:var(--mint-dark); }
.b-mint .bdot { background:var(--mint); }
.b-warn { background:var(--warn-light); color:var(--warn); }
.b-warn .bdot { background:var(--warn); }
.b-danger { background:var(--danger-light); color:var(--danger); }
.b-danger .bdot { background:var(--danger); }
.b-dim { background:var(--surface2); color:var(--text-muted); }
.b-dim .bdot { background:var(--text-dim); }
.b-cream { background:rgba(139,115,85,0.12); color:var(--cream-dark); }
.b-cream .bdot { background:var(--cream-dark); }

/* SCORE */
.score-bar { display:flex; align-items:center; gap:8px; }
.score-track { flex:1; height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; max-width:70px; }
.score-fill { height:100%; border-radius:2px; }
.score-n { font-family:'DM Mono',monospace; font-size:11px; color:var(--text-muted); min-width:26px; }

/* ACTIVITY */
.act-item { display:flex; gap:12px; padding:13px 20px; border-bottom:1px solid var(--border); align-items:flex-start; }
.act-item:last-child { border-bottom:none; }
.act-dot { width:8px; height:8px; border-radius:50%; margin-top:4px; flex-shrink:0; }
.act-ttl { font-size:13px; color:var(--text); font-weight:500; margin-bottom:2px; }
.act-meta { font-size:11px; color:var(--text-dim); font-family:'DM Mono',monospace; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

/* LOADING / EMPTY */
.loading { display:flex; align-items:center; justify-content:center; padding:40px; color:var(--text-dim); font-size:13px; gap:10px; }
.spinner { width:15px; height:15px; border:2px solid var(--border-strong); border-top-color:var(--mint); border-radius:50%; animation:spin 0.8s linear infinite; flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }
.empty { text-align:center; padding:44px; color:var(--text-dim); }
.empty-ico { font-size:28px; margin-bottom:10px; opacity:0.4; }

/* TOAST */
.toast-wrap { position:fixed; bottom:24px; right:24px; display:flex; flex-direction:column; gap:8px; z-index:9999; }
.toast { background:var(--text); color:var(--bg); border-radius:10px; padding:12px 16px; font-size:13px; display:flex; align-items:center; gap:9px; min-width:250px; box-shadow:0 8px 28px rgba(0,0,0,0.15); animation:slide-up 0.2s ease; }
.toast.success { border-left:3px solid var(--mint); }
.toast.error { border-left:3px solid var(--danger); }
.toast.info { border-left:3px solid var(--cream-dark); }
@keyframes slide-up { from { transform:translateY(12px); opacity:0; } to { transform:translateY(0); opacity:1; } }

/* MODAL */
.modal-ov { position:fixed; inset:0; background:rgba(30,26,20,0.5); display:flex; align-items:center; justify-content:center; z-index:500; backdrop-filter:blur(3px); }
.modal { background:var(--surface); border:1px solid var(--border-strong); border-radius:16px; padding:26px; width:560px; max-width:90vw; max-height:80vh; overflow-y:auto; }
.modal-ttl { font-family:'Syne',sans-serif; font-size:17px; font-weight:700; margin-bottom:16px; }
.modal-foot { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
.email-pre { background:var(--bg); border:1px solid var(--border-strong); border-radius:8px; padding:13px; font-size:12px; line-height:1.7; color:var(--text-muted); white-space:pre-wrap; font-family:'DM Mono',monospace; max-height:240px; overflow-y:auto; }

/* FILTER */
.filter-bar { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.fbtn { padding:5px 13px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--border-strong); background:transparent; color:var(--text-muted); font-family:'DM Sans',sans-serif; transition:all 0.15s; }
.fbtn:hover { background:var(--surface2); color:var(--text); }
.fbtn.on { background:var(--mint-light); border-color:var(--mint-mid); color:var(--mint-dark); }

/* GRID */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }

/* PROFILE */
.profile-grid { display:grid; grid-template-columns:270px 1fr; gap:22px; }
.p-side { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px; height:fit-content; }
.p-avatar { width:70px; height:70px; border-radius:50%; background:linear-gradient(135deg,var(--mint),var(--mint-dark)); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; color:white; font-family:'Syne',sans-serif; margin:0 auto 12px; border:3px solid var(--mint-light); }
.p-name { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; text-align:center; margin-bottom:3px; }
.p-email { font-size:11px; color:var(--text-muted); font-family:'DM Mono',monospace; text-align:center; margin-bottom:14px; }
.p-stats { display:flex; justify-content:space-around; padding:12px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-bottom:14px; }
.p-stat-v { font-family:'Syne',sans-serif; font-size:20px; font-weight:700; color:var(--mint-dark); text-align:center; }
.p-stat-l { font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.8px; font-family:'DM Mono',monospace; text-align:center; }
.p-nav { display:flex; flex-direction:column; gap:3px; margin-top:14px; }
.p-nav-item { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text-muted); transition:all 0.15s; border:1px solid transparent; }
.p-nav-item:hover { background:var(--surface2); color:var(--text); }
.p-nav-item.on { background:var(--mint-light); color:var(--mint-dark); border-color:var(--mint-mid); font-weight:500; }
.fsec { margin-bottom:26px; }
.fsec-ttl { font-family:'Syne',sans-serif; font-size:14px; font-weight:600; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
.tags-wrap { display:flex; flex-wrap:wrap; gap:7px; padding:9px 10px; background:var(--bg); border:1.5px solid var(--border-strong); border-radius:9px; min-height:42px; align-items:flex-start; transition:border-color 0.15s; }
.tags-wrap:focus-within { border-color:var(--mint); box-shadow:0 0 0 3px rgba(45,184,122,0.1); }
.tag { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; background:var(--mint-light); border:1px solid var(--mint-mid); border-radius:20px; font-size:12px; color:var(--mint-dark); font-weight:500; }
.tag-x { cursor:pointer; color:var(--mint-mid); font-size:14px; line-height:1; transition:color 0.1s; }
.tag-x:hover { color:var(--danger); }
.tag-inp { border:none; background:transparent; outline:none; font-size:13px; color:var(--text); font-family:'DM Sans',sans-serif; flex:1; min-width:100px; padding:3px 2px; }
.tag-inp::placeholder { color:var(--text-dim); }
textarea.form-inp { resize:vertical; min-height:88px; line-height:1.6; }
select.form-inp { cursor:pointer; }
.sec-info-row { display:flex; gap:10px; padding:10px 13px; background:var(--bg); border-radius:8px; border:1px solid var(--border); margin-bottom:8px; }
.sec-key { font-size:12px; font-weight:600; color:var(--mint-dark); min-width:110px; font-family:'DM Mono',monospace; }
.sec-val { font-size:12px; color:var(--text-muted); }

::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:3px; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API = 'http://localhost:8000';

// ── Auth helpers ──
const getToken = () => sessionStorage.getItem('jat');
const setToken = t => sessionStorage.setItem('jat', t);
const getUser  = () => { try { return JSON.parse(sessionStorage.getItem('jau')||'null'); } catch { return null; } };
const setUser  = u => sessionStorage.setItem('jau', JSON.stringify(u));
const clearAuth = () => { sessionStorage.removeItem('jat'); sessionStorage.removeItem('jau'); };

async function api(path, opts={}) {
  const tok = getToken();
  const hdrs = {'Content-Type':'application/json',...(opts.headers||{})};
  if (tok) hdrs['Authorization'] = `Bearer ${tok}`;
  const r = await fetch(API+path, {...opts, headers:hdrs});
  if (r.status === 401) { clearAuth(); window.location.reload(); return null; }
  return r;
}

// ── Toast ──
function Toasts({items}) {
  return <div className="toast-wrap">{items.map(t=><div key={t.id} className={`toast ${t.type}`}><span>{t.type==='success'?'✓':t.type==='error'?'✕':'ℹ'}</span>{t.msg}</div>)}</div>;
}
function useToast() {
  const [items,setItems] = useState([]);
  const add = (msg,type='info') => {
    const id = Date.now();
    setItems(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setItems(p=>p.filter(t=>t.id!==id)),3500);
  };
  return {items, ok:m=>add(m,'success'), err:m=>add(m,'error'), info:m=>add(m,'info')};
}

// ── Status badge ──
const ST = {
  sent:{l:'Envoyée',c:'b-mint'}, pending_review:{l:'À valider',c:'b-warn'}, ready_to_send:{l:'Prête',c:'b-warn'},
  follow_up_sent:{l:'Relancée',c:'b-cream'}, response_received:{l:'Réponse',c:'b-mint'},
  interview_proposed:{l:'Entretien 🎯',c:'b-mint'}, refused:{l:'Refus',c:'b-danger'}, archived:{l:'Archivée',c:'b-dim'},
};
function SBadge({s}) {
  const d = ST[s]||{l:s,c:'b-dim'};
  return <span className={`badge ${d.c}`}><span className="bdot"></span>{d.l}</span>;
}
function ScoreBar({s}) {
  if(!s) return <span style={{color:'var(--text-dim)',fontSize:12}}>—</span>;
  const col = s>=80?'var(--mint)':s>=60?'var(--warn)':'var(--danger)';
  return <div className="score-bar"><div className="score-track"><div className="score-fill" style={{width:`${s}%`,background:col}}></div></div><span className="score-n">{s}</span></div>;
}

// ── Tag Input ──
function TagInput({values=[],onChange,placeholder}) {
  const [inp,setInp] = useState('');
  const add = () => { const v=inp.trim(); if(v&&!values.includes(v)) onChange([...values,v]); setInp(''); };
  return (
    <div className="tags-wrap">
      {values.map((v,i)=><span className="tag" key={i}>{v}<span className="tag-x" onClick={()=>onChange(values.filter((_,j)=>j!==i))}>×</span></span>)}
      <input className="tag-inp" value={inp} onChange={e=>setInp(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter'||e.key===','){e.preventDefault();add();} }}
        placeholder={values.length===0?placeholder:'Ajouter...'} />
    </div>
  );
}

// AUTH PAGE

function AuthPage({onLogin}) {
  const [mode,setMode]=useState('login');
  const [form,setForm]=useState({email:'',password:'',full_name:''});
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));

  const submit = async () => {
    setErr('');
    if(!form.email||!form.password){setErr('Champs requis');return;}
    if(mode==='register'&&!form.full_name){setErr('Nom requis');return;}
    setLoading(true);
    try {
      const body = mode==='login'
        ? {email:form.email,password:form.password}
        : {email:form.email,password:form.password,full_name:form.full_name};
      const r = await fetch(`${API}/api/auth/${mode==='login'?'login':'register'}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d = await r.json();
      if(!r.ok){setErr(d.detail||'Erreur');return;}
      setToken(d.access_token);
      setUser(d.user);
      onLogin(d.user);
    } catch { setErr('Serveur inaccessible — vérifie que l\'API tourne sur :8000'); }
    finally { setLoading(false); }
  };

  return (
    <div className="auth-wrap">
      <div className="auth-left">
        <div className="auth-brand">Job<span>Agent</span></div>
        <div className="auth-left-body">
          <div className="auth-tagline">Ton agent IA<br/>pour décrocher<br/>ton <span>stage</span></div>
          <div className="auth-desc">Scraping, scoring, candidatures personnalisées et relances automatiques — tu valides, l'agent travaille.</div>
        </div>
        <div className="auth-features">
          {['Scraping WTTJ quotidien','Scoring GPT-4o-mini','Candidatures personnalisées','Relances J+7 auto','Classification des réponses'].map(f=>(
            <div className="auth-feature" key={f}><div className="auth-dot"></div>{f}</div>
          ))}
        </div>
      </div>
      <div className="auth-right">
        <div className="auth-box">
          <div className="auth-title">{mode==='login'?'Connexion':'Créer un compte'}</div>
          <div className="auth-sub">{mode==='login'?'Accède à ton dashboard':'Configure ton agent en 2 min'}</div>
          {err && <div className="auth-err">⚠ {err}</div>}
          {mode==='register'&&(
            <div className="form-grp">
              <label className="form-lbl">Prénom & Nom</label>
              <input className="form-inp" placeholder="Ibrahim Bah" value={form.full_name} onChange={e=>set('full_name',e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} />
            </div>
          )}
          <div className="form-grp">
            <label className="form-lbl">Email</label>
            <input className="form-inp" type="email" placeholder="ton@email.com" value={form.email} onChange={e=>set('email',e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} />
          </div>
          <div className="form-grp">
            <label className="form-lbl">Mot de passe</label>
            <input className="form-inp" type="password" placeholder={mode==='register'?'Min. 8 cars, 1 maj, 1 chiffre':'••••••••'} value={form.password} onChange={e=>set('password',e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} />
            {mode==='register'&&<div className="pw-hint">Min. 8 caractères · 1 majuscule · 1 chiffre</div>}
          </div>
          <button className="btn-submit" onClick={submit} disabled={loading}>
            {loading&&<span className="spinner"></span>}
            {loading?'...':(mode==='login'?'Se connecter':'Créer mon compte')}
          </button>
          <div className="auth-toggle">
            {mode==='login'
              ?<>Pas de compte ? <a onClick={()=>{setMode('register');setErr('');}}>Créer un compte</a></>
              :<>Déjà inscrit ? <a onClick={()=>{setMode('login');setErr('');}}>Se connecter</a></>}
          </div>
        </div>
      </div>
    </div>
  );
}

function DashboardPage({toast,user}) {
  const [apps,setApps]=useState(null);
  const [jobs,setJobs]=useState(null);
  const [gmail,setGmail]=useState(null);
  const [busy,setBusy]=useState({});
  const set=(k,v)=>setBusy(p=>({...p,[k]:v}));

  useEffect(()=>{
    api('/api/applications/').then(r=>r?.json()).then(d=>d&&setApps(d));
    api('/api/jobs/').then(r=>r?.json()).then(d=>d&&setJobs(d));
    api('/api/auth/gmail/status').then(r=>r?.json()).then(d=>d&&setGmail(d));
  },[]);

  const stats = {
    total:apps?.length||0, sent:apps?.filter(a=>a.status==='sent').length||0,
    interviews:apps?.filter(a=>['interview_proposed','interview_confirmed'].includes(a.status)).length||0,
    pending:apps?.filter(a=>['pending_review','ready_to_send'].includes(a.status)).length||0,
    jobsTotal:jobs?.length||0, shortlisted:jobs?.filter(j=>j.status==='shortlisted').length||0,
  };

  const action = async (key,path,method='POST',successMsg) => {
    set(key,true);
    try {
      const r = await api(path,{method});
      const d = await r.json();
      toast.ok(successMsg||(d.scored?`${d.scored} offres scorées`:d.classified?`${d.classified} email(s) classifié(s)`:'Lancé !'));
    } catch { toast.err('Erreur'); }
    finally { setTimeout(()=>set(key,false),2500); }
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Bonjour {user?.full_name?.split(' ')[0]||'là'} 👋</div>
          <div className="page-sub">{gmail?.connected?`✓ Gmail — ${gmail.email}`:'⚠ Gmail non connecté'}</div>
        </div>
        <div className="hdr-actions">
          <button className="btn btn-sec btn-sm" disabled={busy.cls} onClick={()=>action('cls','/api/applications/classify-responses','POST','Emails classifiés')}>
            {busy.cls?<span className="spinner"></span>:'📬'} Classifier
          </button>
          <button className="btn btn-sec btn-sm" disabled={busy.score} onClick={()=>action('score','/api/jobs/score-all','POST')}>
            {busy.score?<span className="spinner"></span>:'⚡'} Scorer
          </button>
          <button className="btn btn-mint btn-sm" disabled={busy.scrape} onClick={()=>action('scrape','/api/jobs/scrape','POST','Scraping lancé !')}>
            {busy.scrape?<span className="spinner"></span>:'🔍'} Scraper WTTJ
          </button>
        </div>
      </div>

      <div className="stats-grid">
        {[
          {c:'c-mint',ico:'📨',lbl:'Candidatures',val:stats.total,sub:`${stats.sent} envoyées`},
          {c:'c-cream',ico:'🎯',lbl:'Entretiens',val:stats.interviews,sub:'proposés/confirmés'},
          {c:'c-warn',ico:'⏳',lbl:'À valider',val:stats.pending,sub:'brouillons en attente'},
          {c:'c-dim',ico:'📋',lbl:'Offres',val:stats.jobsTotal,sub:`${stats.shortlisted} shortlistées`},
        ].map(s=>(
          <div className={`stat-card ${s.c}`} key={s.lbl}>
            <span className="stat-ico">{s.ico}</span>
            <div className="stat-lbl">{s.lbl}</div>
            <div className="stat-val">{s.val}</div>
            <div className="stat-sub">{s.sub}</div>
          </div>
        ))}
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="card-hdr"><span className="card-ttl">Candidatures récentes</span></div>
          {!apps?<div className="loading"><span className="spinner"></span>Chargement...</div>:
           apps.length===0?<div className="empty"><div className="empty-ico">📭</div><div>Aucune candidature</div></div>:
           apps.slice(0,5).map(a=>(
            <div className="act-item" key={a.id}>
              <div className="act-dot" style={{background:a.status==='interview_proposed'?'var(--mint)':a.status==='refused'?'var(--danger)':a.status==='sent'?'var(--cream-dark)':'var(--warn)'}}></div>
              <div><div className="act-ttl">{a.offer}</div><div className="act-meta"><span>{a.company}</span><SBadge s={a.status}/></div></div>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="card-hdr"><span className="card-ttl">Meilleures offres</span></div>
          {!jobs?<div className="loading"><span className="spinner"></span>Chargement...</div>:
           jobs.filter(j=>j.relevance_score).sort((a,b)=>b.relevance_score-a.relevance_score).slice(0,5).length===0
           ?<div className="empty"><div className="empty-ico">🔍</div><div>Lance un scraping</div></div>
           :jobs.filter(j=>j.relevance_score).sort((a,b)=>b.relevance_score-a.relevance_score).slice(0,5).map(j=>(
            <div className="act-item" key={j.id}>
              <div className="act-dot" style={{background:j.relevance_score>=80?'var(--mint)':j.relevance_score>=60?'var(--warn)':'var(--danger)'}}></div>
              <div><div className="act-ttl">{j.title}</div><div className="act-meta"><span>{j.platform}</span><ScoreBar s={j.relevance_score}/></div></div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ApplicationsPage({toast}) {
  const [apps,setApps]=useState(null);
  const [filter,setFilter]=useState('all');
  const [sel,setSel]=useState(null);
  const [gen,setGen]=useState(false);
  const load=()=>api('/api/applications/').then(r=>r?.json()).then(d=>d&&setApps(d));
  useEffect(()=>{load();},[]);
  const filtered=apps?apps.filter(a=>filter==='all'?true:filter==='pending'?['pending_review','ready_to_send'].includes(a.status):filter==='sent'?a.status==='sent':filter==='interview'?['interview_proposed','interview_confirmed'].includes(a.status):filter==='followup'?a.status==='follow_up_sent':filter==='refused'?a.status==='refused':true):[];
  const loadDet=async id=>{const r=await api(`/api/applications/${id}`);const d=await r.json();setSel(d);};
  const genBatch=async()=>{setGen(true);try{const r=await api('/api/applications/generate-batch?limit=5',{method:'POST'});const d=await r.json();toast.ok(`${d.generated} candidature(s) générée(s)`);load();}catch{toast.err('Erreur');}finally{setGen(false);}};
  const FILTERS=[{k:'all',l:'Toutes'},{k:'pending',l:'⏳ À valider'},{k:'sent',l:'📨 Envoyées'},{k:'interview',l:'🎯 Entretiens'},{k:'followup',l:'🔁 Relancées'},{k:'refused',l:'✕ Refus'}];
  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Candidatures</div><div className="page-sub">{apps?`${apps.length} au total`:''}</div></div>
        <div className="hdr-actions">
          <button className="btn btn-sec btn-sm" onClick={()=>api('/api/applications/trigger-followups',{method:'POST'}).then(()=>toast.info('Relances vérifiées'))}>🔁 Relances</button>
          <button className="btn btn-mint btn-sm" onClick={genBatch} disabled={gen}>{gen?<span className="spinner"></span>:'✨'} Générer</button>
        </div>
      </div>
      <div className="filter-bar">{FILTERS.map(f=><button key={f.k} className={`fbtn ${filter===f.k?'on':''}`} onClick={()=>setFilter(f.k)}>{f.l}</button>)}</div>
      <div className="card">
        {!apps?<div className="loading"><span className="spinner"></span>Chargement...</div>:
         filtered.length===0?<div className="empty"><div className="empty-ico">📭</div><div>Aucune candidature</div></div>:(
          <table className="tbl">
            <thead><tr><th>Poste</th><th>Entreprise</th><th>Statut</th><th>Confiance</th><th>Date</th><th></th></tr></thead>
            <tbody>{filtered.map(a=>(
              <tr key={a.id}>
                <td className="tc" style={{maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.offer}</td>
                <td>{a.company}</td><td><SBadge s={a.status}/></td>
                <td>{a.confidence?<span style={{fontFamily:'DM Mono,monospace',fontSize:12,color:a.confidence>=0.85?'var(--mint-dark)':'var(--warn)'}}>{Math.round(a.confidence*100)}%</span>:'—'}</td>
                <td style={{fontFamily:'DM Mono,monospace',fontSize:11,color:'var(--text-dim)'}}>{new Date(a.created_at).toLocaleDateString('fr-FR')}</td>
                <td><button className="btn btn-ghost btn-sm" onClick={()=>loadDet(a.id)}>👁 Voir</button></td>
              </tr>
            ))}</tbody>
          </table>
        )}
      </div>
      {sel&&(
        <div className="modal-ov" onClick={()=>setSel(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-ttl">{sel.offer}</div>
            <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:14}}>{sel.company}</div>
            <div style={{fontSize:11,color:'var(--text-dim)',fontFamily:'DM Mono,monospace',textTransform:'uppercase',letterSpacing:'1px',marginBottom:5}}>Sujet</div>
            <div style={{fontSize:13,padding:'10px 13px',background:'var(--bg)',borderRadius:8,border:'1px solid var(--border-strong)',marginBottom:14}}>{sel.email_subject}</div>
            <div style={{fontSize:11,color:'var(--text-dim)',fontFamily:'DM Mono,monospace',textTransform:'uppercase',letterSpacing:'1px',marginBottom:5}}>Email</div>
            <div className="email-pre">{sel.email_body}</div>
            <div style={{display:'flex',gap:8,marginTop:12,flexWrap:'wrap'}}><SBadge s={sel.status}/>{sel.confidence&&<span className="badge b-dim">Confiance : {Math.round(sel.confidence*100)}%</span>}</div>
            <div className="modal-foot"><button className="btn btn-ghost" onClick={()=>setSel(null)}>Fermer</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function OffersPage({toast}) {
  const [jobs,setJobs]=useState(null);
  const [filter,setFilter]=useState('all');
  const [scoring,setScoring]=useState(false);
  const [gf,setGf]=useState({});
  const load=()=>api('/api/jobs/').then(r=>r?.json()).then(d=>d&&setJobs(d));
  useEffect(()=>{load();},[]);
  const filtered=jobs?jobs.filter(j=>filter==='all'?true:j.status===filter):[];
  const scoreAll=async()=>{setScoring(true);try{const r=await api('/api/jobs/score-all',{method:'POST'});const d=await r.json();toast.ok(`${d.scored} offres scorées`);load();}catch{toast.err('Erreur');}finally{setScoring(false);}};
  const gen=async id=>{setGf(p=>({...p,[id]:true}));try{const r=await api(`/api/applications/generate/${id}`,{method:'POST'});const d=await r.json();toast.ok(`Candidature générée — ${Math.round((d.confidence||0)*100)}%`);}catch{toast.err('Erreur');}finally{setGf(p=>({...p,[id]:false}));}};
  const FILTERS=[{k:'all',l:'Toutes'},{k:'to_review',l:'🔍 À analyser'},{k:'shortlisted',l:'⭐ Shortlistées'},{k:'to_apply',l:'📤 À candidater'},{k:'ignored',l:'✕ Ignorées'}];
  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Offres d'emploi</div><div className="page-sub">{jobs?`${jobs.length} en base`:''}</div></div>
        <div className="hdr-actions">
          <button className="btn btn-sec btn-sm" onClick={scoreAll} disabled={scoring}>{scoring?<span className="spinner"></span>:'⚡'} Scorer (10)</button>
          <button className="btn btn-mint btn-sm" onClick={()=>api('/api/jobs/scrape',{method:'POST'}).then(()=>toast.ok('Scraping lancé !'))}>🔍 Scraper WTTJ</button>
        </div>
      </div>
      <div className="filter-bar">{FILTERS.map(f=><button key={f.k} className={`fbtn ${filter===f.k?'on':''}`} onClick={()=>setFilter(f.k)}>{f.l} {jobs?`(${jobs.filter(j=>f.k==='all'?true:j.status===f.k).length})`:''}</button>)}</div>
      <div className="card">
        {!jobs?<div className="loading"><span className="spinner"></span>Chargement...</div>:
         filtered.length===0?<div className="empty"><div className="empty-ico">🔍</div><div>Lance un scraping</div></div>:(
          <table className="tbl">
            <thead><tr><th>Titre</th><th>Plateforme</th><th>Lieu</th><th>Score</th><th>Statut</th><th></th></tr></thead>
            <tbody>{filtered.map(j=>(
              <tr key={j.id}>
                <td className="tc" style={{maxWidth:230,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{j.title}</td>
                <td><span className="badge b-dim">{j.platform}</span></td>
                <td style={{fontSize:12}}>{j.location||'—'}</td>
                <td><ScoreBar s={j.relevance_score}/></td>
                <td><span className={`badge ${j.status==='shortlisted'?'b-mint':j.status==='ignored'?'b-danger':'b-dim'}`}><span className="bdot"></span>{j.status}</span></td>
                <td><div style={{display:'flex',gap:5}}>
                  {j.status==='shortlisted'&&<button className="btn btn-mint btn-sm" onClick={()=>gen(j.id)} disabled={gf[j.id]}>{gf[j.id]?<span className="spinner"></span>:'✨'}</button>}
                  <a href={j.url} target="_blank" className="btn btn-ghost btn-sm">🔗</a>
                </div></td>
              </tr>
            ))}</tbody>
          </table>
        )}
      </div>
    </div>
  );
}

function ProfilePage({toast,user}) {
  const [form,setForm]=useState(null);
  const [saving,setSaving]=useState(false);
  const [tab,setTab]=useState('info');
  const [pw,setPw]=useState({cur:'',nxt:'',cfm:''});
  const [pwErr,setPwErr]=useState('');
  const [pwLoading,setPwLoading]=useState(false);
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));

  useEffect(()=>{
    api('/api/profile/').then(r=>r?.json()).then(d=>{if(d&&!d.detail)setForm(d);});
  },[]);

  const save=async()=>{
    setSaving(true);
    try{const r=await api('/api/profile/',{method:'PATCH',body:JSON.stringify(form)});
    if(r.ok){toast.ok('Profil sauvegardé ✓');}else{const d=await r.json();toast.err(d.detail||'Erreur');}
    }catch{toast.err('Erreur réseau');}finally{setSaving(false);}
  };

  const changePw=async()=>{
    setPwErr('');
    if(pw.nxt!==pw.cfm){setPwErr('Les mots de passe ne correspondent pas');return;}
    if(pw.nxt.length<8){setPwErr('Min. 8 caractères');return;}
    setPwLoading(true);
    try{const r=await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({current_password:pw.cur,new_password:pw.nxt})});
    const d=await r.json();
    if(r.ok){toast.ok('Mot de passe modifié ✓');setPw({cur:'',nxt:'',cfm:''});}else setPwErr(d.detail||'Erreur');
    }catch{setPwErr('Erreur réseau');}finally{setPwLoading(false);}
  };

  if(!form) return <div className="loading"><span className="spinner"></span>Chargement...</div>;

  const initials=((form.first_name||'')[0]||'')+((form.last_name||'')[0]||'');
  const TABS=[{k:'info',ico:'👤',l:'Infos personnelles'},{k:'skills',ico:'⚡',l:'Compétences'},{k:'search',ico:'🎯',l:'Recherche'},{k:'text',ico:'✍️',l:'Textes candidature'},{k:'security',ico:'🔒',l:'Sécurité'}];

  return (
    <div>
      <div className="page-header">
        <div><div className="page-title">Mon Profil</div><div className="page-sub">Personnalise chaque candidature générée</div></div>
        {tab!=='security'&&<button className="btn btn-mint" onClick={save} disabled={saving}>{saving?<span className="spinner"></span>:'💾'} Sauvegarder</button>}
      </div>

      <div className="profile-grid">
        {/* SIDEBAR */}
        <div>
          <div className="p-side">
            <div className="p-avatar">{initials.toUpperCase()||'?'}</div>
            <div className="p-name">{form.first_name} {form.last_name}</div>
            <div className="p-email">{user?.email}</div>
            <div className="p-stats">
              <div><div className="p-stat-v">{form.skills_technical?.length||0}</div><div className="p-stat-l">Skills</div></div>
              <div><div className="p-stat-v">{form.target_roles?.length||0}</div><div className="p-stat-l">Postes</div></div>
              <div><div className="p-stat-v">{form.languages?.length||0}</div><div className="p-stat-l">Langues</div></div>
            </div>
            {form.pitch&&<div style={{fontSize:12,color:'var(--text-muted)',lineHeight:1.6,fontStyle:'italic',marginTop:4}}>"{form.pitch.slice(0,110)}{form.pitch.length>110?'...':''}"</div>}
          </div>
          <div className="p-nav" style={{marginTop:12}}>
            {TABS.map(t=><div key={t.k} className={`p-nav-item ${tab===t.k?'on':''}`} onClick={()=>setTab(t.k)}><span>{t.ico}</span>{t.l}</div>)}
          </div>
        </div>

        {/* CONTENT */}
        <div className="card" style={{height:'fit-content'}}>
          <div style={{padding:24}}>

            {tab==='info'&&(
              <div>
                <div className="fsec">
                  <div className="fsec-ttl">👤 Identité</div>
                  <div className="form-row">
                    <div className="form-grp"><label className="form-lbl">Prénom</label><input className="form-inp" value={form.first_name||''} onChange={e=>set('first_name',e.target.value)}/></div>
                    <div className="form-grp"><label className="form-lbl">Nom</label><input className="form-inp" value={form.last_name||''} onChange={e=>set('last_name',e.target.value)}/></div>
                  </div>
                  <div className="form-row">
                    <div className="form-grp"><label className="form-lbl">Téléphone</label><input className="form-inp" value={form.phone||''} onChange={e=>set('phone',e.target.value)} placeholder="+33 6 XX XX XX XX"/></div>
                    <div className="form-grp"><label className="form-lbl">Localisation</label><input className="form-inp" value={form.location||''} onChange={e=>set('location',e.target.value)} placeholder="Paris, France"/></div>
                  </div>
                  <div className="form-row">
                    <div className="form-grp"><label className="form-lbl">LinkedIn</label><input className="form-inp" value={form.linkedin_url||''} onChange={e=>set('linkedin_url',e.target.value)} placeholder="linkedin.com/in/..."/></div>
                    <div className="form-grp"><label className="form-lbl">Portfolio / GitHub</label><input className="form-inp" value={form.portfolio_url||''} onChange={e=>set('portfolio_url',e.target.value)} placeholder="github.com/..."/></div>
                  </div>
                </div>
                <div className="fsec">
                  <div className="fsec-ttl">🎓 Formation</div>
                  <div className="form-row">
                    <div className="form-grp"><label className="form-lbl">Niveau</label><input className="form-inp" value={form.education_level||''} onChange={e=>set('education_level',e.target.value)} placeholder="Master Data Science"/></div>
                    <div className="form-grp"><label className="form-lbl">École</label><input className="form-inp" value={form.school||''} onChange={e=>set('school',e.target.value)} placeholder="Université Paris-Saclay"/></div>
                  </div>
                  <div className="form-grp" style={{maxWidth:180}}><label className="form-lbl">Année diplôme</label><input className="form-inp" value={form.graduation_year||''} onChange={e=>set('graduation_year',e.target.value)} placeholder="2026"/></div>
                </div>
              </div>
            )}

            {tab==='skills'&&(
              <div>
                <div className="fsec"><div className="fsec-ttl">⚡ Tech & Data</div><div className="form-grp"><label className="form-lbl">Compétences techniques (Entrée pour ajouter)</label><TagInput values={form.skills_technical||[]} onChange={v=>set('skills_technical',v)} placeholder="Python, SQL, Pandas, scikit-learn..."/></div><div className="form-grp" style={{marginTop:14}}><label className="form-lbl">Outils & Logiciels</label><TagInput values={form.tools||[]} onChange={v=>set('tools',v)} placeholder="Power BI, Tableau, Excel, Spark..."/></div></div>
                <div className="fsec"><div className="fsec-ttl">🤝 Soft skills</div><div className="form-grp"><TagInput values={form.skills_soft||[]} onChange={v=>set('skills_soft',v)} placeholder="Rigueur, Communication, Esprit d'analyse..."/></div></div>
                <div className="fsec"><div className="fsec-ttl">🌍 Langues</div><div style={{fontSize:12,color:'var(--text-muted)',marginBottom:8}}>Format : "Français - Natif", "Anglais - C1"</div><TagInput values={form.languages?.map(l=>typeof l==='object'?`${l.lang} - ${l.level}`:l)||[]} onChange={v=>set('languages',v.map(s=>{const p=s.split(' - ');return{lang:p[0],level:p[1]||''}}))} placeholder="Français - Natif"/></div>
              </div>
            )}

            {tab==='search'&&(
              <div>
                <div className="fsec">
                  <div className="fsec-ttl">🎯 Objectif</div>
                  <div className="form-grp"><label className="form-lbl">Postes visés</label><TagInput values={form.target_roles||[]} onChange={v=>set('target_roles',v)} placeholder="Data Analyst, Data Scientist..."/></div>
                  <div className="form-grp" style={{marginTop:14}}><label className="form-lbl">Localisations</label><TagInput values={form.target_locations||[]} onChange={v=>set('target_locations',v)} placeholder="Paris, Remote, Lyon..."/></div>
                  <div className="form-row" style={{marginTop:14}}>
                    <div className="form-grp"><label className="form-lbl">Type de contrat</label>
                      <select className="form-inp" value={form.target_contract||'stage'} onChange={e=>set('target_contract',e.target.value)}>
                        <option value="stage">Stage</option><option value="alternance">Alternance</option><option value="cdi">CDI</option><option value="cdd">CDD</option><option value="freelance">Freelance</option>
                      </select>
                    </div>
                    <div className="form-grp"><label className="form-lbl">Disponibilité</label><input className="form-inp" value={form.availability_date||''} onChange={e=>set('availability_date',e.target.value)} placeholder="Septembre 2025"/></div>
                  </div>
                  <div className="form-grp" style={{maxWidth:200,marginTop:4}}><label className="form-lbl">Rémunération souhaitée</label><input className="form-inp" value={form.min_salary||''} onChange={e=>set('min_salary',e.target.value)} placeholder="800€/mois"/></div>
                </div>
              </div>
            )}

            {tab==='text'&&(
              <div>
                <div style={{padding:'11px 14px',background:'var(--mint-light)',border:'1px solid var(--mint-mid)',borderRadius:9,marginBottom:20,fontSize:13,color:'var(--mint-dark)'}}>
                  💡 Ces textes guident GPT pour personnaliser chaque candidature. Sois précis et authentique.
                </div>
                <div className="fsec">
                  <div className="fsec-ttl">✍️ Présentation</div>
                  <div className="form-grp"><label className="form-lbl">Pitch (2-3 phrases)</label><textarea className="form-inp" value={form.pitch||''} onChange={e=>set('pitch',e.target.value)} placeholder="Étudiant en Master Data Science à Paris-Saclay, passionné par l'analyse de données..."/></div>
                  <div className="form-grp"><label className="form-lbl">Points forts & Réalisations</label><textarea className="form-inp" value={form.strengths||''} onChange={e=>set('strengths',e.target.value)} placeholder="Projet Kaggle Top 5%, stage chez X où j'ai automatisé des reportings..."/></div>
                  <div className="form-grp"><label className="form-lbl">Motivation générale</label><textarea className="form-inp" value={form.motivation||''} onChange={e=>set('motivation',e.target.value)} placeholder="Passionné par la data dans le secteur financier..."/></div>
                </div>
              </div>
            )}

            {tab==='security'&&(
              <div>
                <div className="fsec">
                  <div className="fsec-ttl">🔒 Changer le mot de passe</div>
                  {pwErr&&<div className="auth-err" style={{marginBottom:14}}>⚠ {pwErr}</div>}
                  <div className="form-grp"><label className="form-lbl">Mot de passe actuel</label><input className="form-inp" type="password" value={pw.cur} onChange={e=>setPw(p=>({...p,cur:e.target.value}))}/></div>
                  <div className="form-grp"><label className="form-lbl">Nouveau mot de passe</label><input className="form-inp" type="password" value={pw.nxt} onChange={e=>setPw(p=>({...p,nxt:e.target.value}))}/><div className="pw-hint">Min. 8 cars · 1 majuscule · 1 chiffre</div></div>
                  <div className="form-grp"><label className="form-lbl">Confirmer</label><input className="form-inp" type="password" value={pw.cfm} onChange={e=>setPw(p=>({...p,cfm:e.target.value}))}/></div>
                  <button className="btn btn-primary" onClick={changePw} disabled={pwLoading}>{pwLoading?<span className="spinner"></span>:'🔒'} Modifier</button>
                </div>
                <div className="fsec">
                  <div className="fsec-ttl">ℹ️ Protections actives</div>
                  {[['Chiffrement','bcrypt rounds=12 — résistant au brute force'],['Tokens','JWT Access 30min + Refresh 7 jours'],['Brute force','Verrouillage 15min après 5 tentatives échouées'],['Validation','Email canonique + force du mot de passe côté serveur']].map(([k,v])=>(
                    <div className="sec-info-row" key={k}><span className="sec-key">{k}</span><span className="sec-val">{v}</span></div>
                  ))}
                </div>
              </div>
            )}

          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════
function App() {
  const [user,setUser]=useState(getUser());
  const [page,setPage]=useState('dashboard');
  const [apps,setApps]=useState(null);
  const toast=useToast();

  useEffect(()=>{
    if(user) api('/api/applications/').then(r=>r?.json()).then(d=>d&&setApps(d));
  },[user]);

  if(!user) return <><AuthPage onLogin={u=>{setUser(u);setPage('dashboard');}}/><Toasts items={toast.items}/></>;

  const pendingCount=apps?.filter(a=>['pending_review','ready_to_send'].includes(a.status)).length||0;
  const interviewCount=apps?.filter(a=>a.status==='interview_proposed').length||0;
  const initials=((user.full_name||user.email||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase());

  const NAV=[{k:'dashboard',ico:'◈',l:'Dashboard'},{k:'applications',ico:'📨',l:'Candidatures',b:pendingCount||null},{k:'offers',ico:'🔍',l:'Offres'}];

  const pages={
    dashboard:<DashboardPage toast={toast} user={user}/>,
    applications:<ApplicationsPage toast={toast}/>,
    offers:<OffersPage toast={toast}/>,
    profile:<ProfilePage toast={toast} user={user}/>,
  };

  return (
    <div className="layout">
      <aside className="sidebar">
        <div className="sb-brand"><div className="sb-logo">Job<span>Agent</span></div><div className="sb-version">v1.0 — MVP</div></div>
        <div className="sb-user">
          <div className="sb-avatar">{initials}</div>
          <div><div className="sb-uname">{user.full_name||'Utilisateur'}</div><div className="sb-uemail">{user.email}</div></div>
        </div>
        <nav className="sb-nav">
          <div className="sb-section">Navigation</div>
          {NAV.map(n=>(
            <div key={n.k} className={`nav-item ${page===n.k?'active':''}`} onClick={()=>setPage(n.k)}>
              <span className="nav-icon">{n.ico}</span>{n.l}
              {n.b?<span className="nav-badge">{n.b}</span>:null}
            </div>
          ))}
          <div className="sb-section">Compte</div>
          <div className={`nav-item ${page==='profile'?'active':''}`} onClick={()=>setPage('profile')}>
            <span className="nav-icon">👤</span>Profil & Compétences
          </div>
          {interviewCount>0&&(
            <div className="sb-interview-alert" style={{marginTop:14}}>
              <div style={{fontSize:12,color:'var(--mint)',fontWeight:600,marginBottom:2}}>🎯 {interviewCount} entretien(s) !</div>
              <div style={{fontSize:11,color:'rgba(45,184,122,0.6)'}}>Vérifier brouillons Gmail</div>
            </div>
          )}
        </nav>
        <div className="sb-bottom">
          <button className="btn-logout" onClick={()=>{clearAuth();setUser(null);}}>↩ Se déconnecter</button>
        </div>
      </aside>
      <main className="main">{pages[page]||pages.dashboard}</main>
      <Toasts items={toast.items}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
