<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — JobAgent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ede0;--surface:#fdf8f0;--surface2:#ede5d6;--border:rgba(160,140,110,0.2);--border-strong:rgba(160,140,110,0.4);--mint:#2db87a;--mint-light:#e8f7f0;--mint-mid:#a8e0c4;--mint-dark:#1e9a63;--cream-dark:#8b7355;--text:#1e1a14;--text-muted:#6b5c42;--text-dim:#a89478;--danger:#c0392b;--danger-light:#fdecea;--warn:#d4842a;--warn-light:#fdf3e7;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
.topbar{background:var(--text);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:var(--bg);letter-spacing:-0.5px;}
.brand span{color:var(--mint);}
.admin-badge{background:var(--warn);color:white;font-size:9px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:20px;letter-spacing:0.5px;}
.logout-btn{color:rgba(255,255,255,0.35);font-size:12px;cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;}
.logout-btn:hover{color:rgba(255,255,255,0.7);}
.main{max-width:1100px;margin:0 auto;padding:24px 18px 60px;}
.page-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;}
.page-sub{font-size:12px;color:var(--text-muted);margin-bottom:24px;}

/* SETUP BANNER */
.setup-banner{background:var(--surface);border:1.5px solid var(--warn);border-radius:12px;padding:20px 22px;margin-bottom:24px;position:relative;overflow:hidden;}
.setup-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--warn);}
.setup-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:7px;}
.setup-sub{font-size:11.5px;color:var(--text-muted);margin-bottom:16px;}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.setup-field{display:flex;flex-direction:column;gap:5px;}
.setup-label{font-size:9.5px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.7px;color:var(--text-dim);}
.setup-input{padding:9px 11px;background:var(--bg);border:1.5px solid var(--border-strong);border-radius:8px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;width:100%;}
.setup-input:focus{border-color:var(--warn);box-shadow:0 0 0 3px rgba(212,132,42,0.1);}
.setup-input:disabled{opacity:0.6;cursor:not-allowed;}
.setup-input.readonly{background:var(--surface2);color:var(--text-muted);font-family:'DM Mono',monospace;font-size:12px;}
.setup-footer{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.btn-create{padding:9px 18px;background:var(--warn);color:white;border:none;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px;}
.btn-create:disabled{opacity:0.5;cursor:not-allowed;}
.setup-note{font-size:10.5px;color:var(--text-dim);}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:11px 11px 0 0;}
.stat-card.c-mint::before{background:var(--mint);}
.stat-card.c-warn::before{background:var(--warn);}
.stat-card.c-cream::before{background:var(--cream-dark);}
.stat-card.c-dim::before{background:var(--text-dim);}
.stat-lbl{font-size:9.5px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.7px;color:var(--text-dim);margin-bottom:4px;}
.stat-val{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;line-height:1;}
.stat-sub{font-size:10.5px;color:var(--text-muted);margin-top:2px;}

/* TABLE */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden;}
.table-hdr{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.table-ttl{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.search-inp{padding:7px 11px;background:var(--bg);border:1.5px solid var(--border-strong);border-radius:8px;font-size:12px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;width:200px;}
.search-inp:focus{border-color:var(--mint);}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{padding:9px 14px;text-align:left;font-size:9.5px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.7px;color:var(--text-dim);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 14px;font-size:12.5px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(160,140,110,0.05);}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;font-family:'DM Mono',monospace;white-space:nowrap;}
.b-mint{background:var(--mint-light);color:var(--mint-dark);}
.b-warn{background:var(--warn-light);color:var(--warn);}
.b-danger{background:var(--danger-light);color:var(--danger);}
.b-dim{background:var(--surface2);color:var(--text-muted);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.btn-mint{background:var(--mint);color:white;}
.btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--border-strong);}
.btn-danger{background:var(--danger-light);color:var(--danger);border:1px solid rgba(192,57,43,0.2);}
.btn-warn{background:var(--warn-light);color:var(--warn);border:1px solid rgba(212,132,42,0.2);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.actions{display:flex;gap:5px;flex-wrap:wrap;}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;padding:32px;width:100%;max-width:380px;}
.auth-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:6px;}
.auth-sub{font-size:12.5px;color:var(--text-muted);margin-bottom:22px;}
.form-grp{margin-bottom:13px;}
.form-lbl{display:block;font-size:10px;font-weight:500;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.8px;font-family:'DM Mono',monospace;}
.form-inp{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--border-strong);border-radius:9px;font-size:13.5px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;}
.form-inp:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(45,184,122,0.1);}
.btn-submit{width:100%;padding:11px;background:var(--text);color:var(--bg);border:none;border-radius:9px;font-size:13.5px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:4px;}
.auth-err{padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:11px;background:var(--danger-light);color:var(--danger);}
.auth-ok{padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:11px;background:var(--mint-light);color:var(--mint-dark);}

/* SPINNER */
.spinner{width:12px;height:12px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;}
.spinner-dark{border:2px solid var(--border-strong);border-top-color:var(--mint);}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:8px;color:var(--text-dim);font-size:12.5px;}

/* TOAST */
.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:6px;z-index:9999;}
.toast{background:var(--text);color:var(--bg);border-radius:9px;padding:10px 14px;font-size:12px;display:flex;align-items:center;gap:7px;box-shadow:0 6px 20px rgba(0,0,0,0.15);animation:slide-up 0.2s ease;min-width:200px;}
.toast.success{border-left:3px solid var(--mint);}
.toast.error{border-left:3px solid var(--danger);}
.toast.info{border-left:3px solid var(--warn);}
@keyframes slide-up{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* QUOTA BAR */
.quota-bar{display:flex;align-items:center;gap:5px;}
.quota-track{width:50px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.quota-fill{height:100%;border-radius:2px;transition:width 0.3s;}

@media(min-width:640px){
  .stats-grid{grid-template-columns:repeat(4,1fr);}
  .main{padding:28px 24px 80px;}
  .setup-grid{grid-template-columns:1fr 1fr 1fr;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const API = 'https://agent-job-1.onrender.com';
const ADMIN_EMAIL = 'contact@ibrahima-bah.com';

const getToken = () => sessionStorage.getItem('jat_admin');
const setToken = t => sessionStorage.setItem('jat_admin', t);
const clearToken = () => sessionStorage.removeItem('jat_admin');

async function api(path, opts = {}) {
  const tok = getToken();
  const hdrs = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (tok) hdrs['Authorization'] = `Bearer ${tok}`;
  const r = await fetch(API + path, { ...opts, headers: hdrs });
  if (r.status === 401) { clearToken(); window.location.reload(); return null; }
  return r;
}

function useToast() {
  const [items, setItems] = useState([]);
  const add = (msg, type = 'info') => {
    const id = Date.now();
    setItems(p => [...p, { id, msg, type }]);
    setTimeout(() => setItems(p => p.filter(t => t.id !== id)), 3500);
  };
  return { items, ok: m => add(m, 'success'), err: m => add(m, 'error'), info: m => add(m, 'info') };
}

function Toasts({ items }) {
  return <div className="toast-wrap">{items.map(t => <div key={t.id} className={`toast ${t.type}`}>{t.type === 'success' ? '✓' : t.type === 'error' ? '✕' : 'ℹ'} {t.msg}</div>)}</div>;
}

function QuotaBar({ used, limit, color }) {
  const pct = Math.min(100, (used / limit) * 100);
  const col = pct >= 100 ? 'var(--danger)' : pct >= 70 ? 'var(--warn)' : color || 'var(--mint)';
  return (
    <div className="quota-bar">
      <div className="quota-track"><div className="quota-fill" style={{ width: `${pct}%`, background: col }}></div></div>
      <span style={{ fontSize: 10, fontFamily: 'DM Mono,monospace', color: 'var(--text-dim)' }}>{used}/{limit}</span>
    </div>
  );
}

// ── SETUP : Création du compte admin ──
function SetupBanner({ toast, onDone }) {
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const create = async () => {
    setErr('');
    if (!password || password.length < 8) { setErr('Mot de passe trop court (min. 8 caractères)'); return; }
    if (password !== confirm) { setErr('Les mots de passe ne correspondent pas'); return; }
    setLoading(true);
    try {
      const r = await fetch(`${API}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: ADMIN_EMAIL, full_name: 'Admin', password }),
      });
      const d = await r.json();
      if (!r.ok) { setErr(d.detail || 'Erreur lors de la création'); setLoading(false); return; }
      toast.ok('Compte admin créé ✓ — vous pouvez maintenant vous connecter');
      onDone();
    } catch { setErr('Serveur inaccessible'); }
    finally { setLoading(false); }
  };

  return (
    <div className="setup-banner">
      <div className="setup-title">⚙ Initialisation du compte administrateur</div>
      <div className="setup-sub">Ce formulaire est à usage unique. Il disparaît dès que le compte est créé.</div>
      {err && <div className="auth-err" style={{marginBottom:12}}>⚠ {err}</div>}
      <div className="setup-grid">
        <div className="setup-field">
          <span className="setup-label">Email admin (fixe)</span>
          <input className="setup-input readonly" value={ADMIN_EMAIL} readOnly disabled />
        </div>
        <div className="setup-field">
          <span className="setup-label">Mot de passe</span>
          <input
            className="setup-input"
            type="password"
            placeholder="Min. 8 caractères"
            value={password}
            onChange={e => setPassword(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && create()}
          />
        </div>
        <div className="setup-field">
          <span className="setup-label">Confirmer le mot de passe</span>
          <input
            className="setup-input"
            type="password"
            placeholder="Répéter le mot de passe"
            value={confirm}
            onChange={e => setConfirm(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && create()}
          />
        </div>
      </div>
      <div className="setup-footer">
        <button className="btn-create" onClick={create} disabled={loading}>
          {loading ? <><span className="spinner"></span> Création...</> : '➕ Créer le compte admin'}
        </button>
        <span className="setup-note">L'email est verrouillé sur {ADMIN_EMAIL}</span>
      </div>
    </div>
  );
}

// ── LOGIN ──
function LoginPage({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setErr(''); setLoading(true);
    try {
      const r = await fetch(`${API}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const d = await r.json();
      if (!r.ok) { setErr(d.detail || 'Erreur'); return; }
      setToken(d.access_token);
      const ra = await fetch(`${API}/api/admin/stats`, {
        headers: { 'Authorization': `Bearer ${d.access_token}` }
      });
      if (ra.status === 403) { clearToken(); setErr('Accès refusé — compte non autorisé'); return; }
      onLogin();
    } catch { setErr('Serveur inaccessible'); }
    finally { setLoading(false); }
  };

  return (
    <div className="auth-wrap">
      <div className="auth-box">
        <div className="auth-title">🔐 Admin</div>
        <div className="auth-sub">Accès réservé aux administrateurs JobAgent</div>
        {err && <div className="auth-err">⚠ {err}</div>}
        <div className="form-grp"><label className="form-lbl">Email admin</label><input className="form-inp" type="email" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="contact@ibrahima-bah.com" /></div>
        <div className="form-grp"><label className="form-lbl">Mot de passe</label><input className="form-inp" type="password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="••••••••" /></div>
        <button className="btn-submit" onClick={submit} disabled={loading}>
          {loading ? <span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><span className="spinner"></span>Connexion...</span> : 'Se connecter'}
        </button>
      </div>
    </div>
  );
}

// ── ADMIN PANEL ──
function AdminPanel({ toast }) {
  const [stats, setStats] = useState(null);
  const [users, setUsers] = useState(null);
  const [search, setSearch] = useState('');
  const [busy, setBusy] = useState({});
  const [showSetup, setShowSetup] = useState(false);

  const loadStats = () => api('/api/admin/stats').then(r => r?.json()).then(d => d && setStats(d));
  const loadUsers = () => api('/api/admin/users').then(r => r?.json()).then(d => d && setUsers(d));

  useEffect(() => {
    loadStats();
    loadUsers();
    // Affiche le setup si aucun compte admin n'existe encore
    fetch(`${API}/api/admin/stats`, { headers: { 'Authorization': `Bearer ${getToken()}` } })
      .then(r => {
        if (r.ok) r.json().then(d => {
          // Si total users == 0 ou l'admin n'est pas encore créé, on propose le setup
          // On détecte: si on est connecté c'est qu'il y a déjà un compte admin
          setShowSetup(false);
        });
      });
  }, []);

  const action = async (userId, endpoint, method, msg) => {
    setBusy(p => ({ ...p, [userId + endpoint]: true }));
    try {
      const r = await api(`/api/admin/users/${userId}/${endpoint}`, { method });
      const d = await r.json();
      if (!r.ok) { toast.err(d.detail || 'Erreur'); return; }
      toast.ok(d.message || msg);
      loadUsers(); loadStats();
    } catch { toast.err('Erreur réseau'); }
    finally { setBusy(p => ({ ...p, [userId + endpoint]: false })); }
  };

  const deleteUser = async (userId, email) => {
    if (!confirm(`Supprimer définitivement ${email} et toutes ses données ?`)) return;
    setBusy(p => ({ ...p, [userId + 'del']: true }));
    try {
      const r = await api(`/api/admin/users/${userId}`, { method: 'DELETE' });
      const d = await r.json();
      toast.ok(d.message || 'Compte supprimé');
      loadUsers(); loadStats();
    } catch { toast.err('Erreur'); }
    finally { setBusy(p => ({ ...p, [userId + 'del']: false })); }
  };

  const filtered = users?.filter(u =>
    u.email.toLowerCase().includes(search.toLowerCase()) ||
    u.full_name.toLowerCase().includes(search.toLowerCase())
  ) || [];

  return (
    <div>
      <div className="topbar">
        <div className="brand">Job<span>Agent</span></div>
        <span className="admin-badge">⚙ ADMIN</span>
        <button className="logout-btn" onClick={() => { clearToken(); window.location.reload(); }}>↩ Déconnexion</button>
      </div>

      <div className="main">
        <div className="page-title">Panel Administrateur</div>
        <div className="page-sub">Gestion des utilisateurs et statistiques d'usage · JobAgent Bêta</div>

        {/* STATS */}
        {!stats ? <div className="loading"><span className="spinner spinner-dark"></span>Chargement...</div> : (
          <div className="stats-grid">
            {[
              { c: 'c-mint', lbl: 'Utilisateurs', val: stats.users.total, sub: `${stats.users.new_this_week} cette semaine` },
              { c: 'c-warn', lbl: 'Premium', val: stats.users.premium, sub: `${stats.users.freemium} freemium` },
              { c: 'c-cream', lbl: 'Candidatures', val: stats.applications.total, sub: `${stats.applications.sent} envoyées · ${stats.applications.interviews} entretiens` },
              { c: 'c-dim', lbl: 'Offres scrapées', val: stats.jobs.total, sub: `${stats.users.active} comptes actifs` },
            ].map(s => (
              <div className={`stat-card ${s.c}`} key={s.lbl}>
                <div className="stat-lbl">{s.lbl}</div>
                <div className="stat-val">{s.val}</div>
                <div className="stat-sub">{s.sub}</div>
              </div>
            ))}
          </div>
        )}

        {/* USERS TABLE */}
        <div className="table-card">
          <div className="table-hdr">
            <span className="table-ttl">👥 Utilisateurs ({users?.length || 0})</span>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              <input className="search-inp" placeholder="🔍 Rechercher..." value={search} onChange={e => setSearch(e.target.value)} />
              <button className="btn btn-sec" onClick={() => { loadUsers(); loadStats(); }}>↻ Actualiser</button>
            </div>
          </div>
          {!users ? <div className="loading"><span className="spinner spinner-dark"></span>Chargement...</div> : (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Utilisateur</th>
                    <th>Plan</th>
                    <th>Statut</th>
                    <th>Candidatures</th>
                    <th>Scraping/j</th>
                    <th>Scoring/j</th>
                    <th>Inscription</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(u => (
                    <tr key={u.id}>
                      <td>
                        <div style={{fontWeight:500,fontSize:13}}>{u.full_name}</div>
                        <div style={{fontSize:11,color:'var(--text-dim)',fontFamily:'DM Mono,monospace'}}>{u.email}</div>
                      </td>
                      <td>
                        {u.is_premium
                          ? <span className="badge b-mint">⭐ Premium</span>
                          : <span className="badge b-dim">Freemium</span>}
                      </td>
                      <td>
                        {u.is_active
                          ? <span className="badge b-mint">● Actif</span>
                          : <span className="badge b-danger">● Bloqué</span>}
                      </td>
                      <td>
                        <QuotaBar used={u.applications_this_month} limit={u.is_premium ? 999 : 5} />
                        <div style={{fontSize:10,color:'var(--text-dim)',marginTop:2}}>{u.applications_count} total</div>
                      </td>
                      <td><QuotaBar used={u.scrapings_today} limit={u.is_premium ? 999 : 2} /></td>
                      <td><QuotaBar used={u.scoring_today} limit={u.is_premium ? 999 : 10} /></td>
                      <td style={{fontSize:11,color:'var(--text-dim)',fontFamily:'DM Mono,monospace'}}>
                        {new Date(u.created_at).toLocaleDateString('fr-FR')}
                      </td>
                      <td>
                        <div className="actions">
                          <button
                            className={`btn ${u.is_premium ? 'btn-sec' : 'btn-mint'}`}
                            onClick={() => action(u.id, 'toggle-premium', 'PATCH', u.is_premium ? 'Passé en freemium' : 'Passé en premium ⭐')}
                            disabled={busy[u.id + 'toggle-premium']}
                          >
                            {u.is_premium ? '↓ Freemium' : '⭐ Premium'}
                          </button>
                          <button
                            className={`btn ${u.is_active ? 'btn-warn' : 'btn-sec'}`}
                            onClick={() => action(u.id, 'toggle-active', 'PATCH', u.is_active ? 'Compte bloqué' : 'Compte activé')}
                            disabled={busy[u.id + 'toggle-active']}
                          >
                            {u.is_active ? '🔒 Bloquer' : '✓ Activer'}
                          </button>
                          <button
                            className="btn btn-sec"
                            onClick={() => action(u.id, 'reset-quotas', 'PATCH', 'Quotas réinitialisés')}
                            disabled={busy[u.id + 'reset-quotas']}
                            title="Réinitialiser les quotas"
                          >↺</button>
                          <button
                            className="btn btn-danger"
                            onClick={() => deleteUser(u.id, u.email)}
                            disabled={busy[u.id + 'del']}
                            title="Supprimer le compte"
                          >🗑</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                  {filtered.length === 0 && (
                    <tr><td colSpan={8} style={{textAlign:'center',padding:32,color:'var(--text-dim)'}}>Aucun utilisateur trouvé</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [logged, setLogged] = useState(!!getToken());
  const [showSetup, setShowSetup] = useState(false);
  const [checkingSetup, setCheckingSetup] = useState(true);
  const toast = useToast();

  useEffect(() => {
    if (logged) { setCheckingSetup(false); return; }
    // Vérifie si le compte admin existe déjà en tentant un login bidon
    // Plus simple : on expose un flag via l'endpoint /health ou on suppose que
    // le setup est nécessaire si l'utilisateur clique sur "Créer le compte"
    setCheckingSetup(false);
  }, [logged]);

  return (
    <>
      {!logged ? (
        <div>
          <LoginPage onLogin={() => setLogged(true)} />
          <div style={{textAlign:'center',marginTop:-20,paddingBottom:30}}>
            {!showSetup ? (
              <button
                onClick={() => setShowSetup(true)}
                style={{background:'none',border:'none',fontSize:11,color:'var(--text-dim)',cursor:'pointer',textDecoration:'underline',fontFamily:'DM Sans,sans-serif'}}
              >
                Première connexion ? Créer le compte admin
              </button>
            ) : (
              <div style={{maxWidth:600,margin:'0 auto',padding:'0 20px'}}>
                <SetupBanner toast={toast} onDone={() => setShowSetup(false)} />
              </div>
            )}
          </div>
        </div>
      ) : (
        <AdminPanel toast={toast} />
      )}
      <Toasts items={toast.items} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
